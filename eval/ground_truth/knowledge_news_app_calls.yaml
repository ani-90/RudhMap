# Hand-labelled ground truth: every connection between Knowledge-News-App's
# own Python definitions, at commit 20d352e. Written by reading every .py file
# in full (1,749 lines), NOT generated from RudhMap's output -- a ground truth
# derived from the tool would measure nothing.
#
# Only connections whose both ends are this repo's own functions/classes are
# listed. Calls into libraries (sqlalchemy, fastapi, groq, ...) and builtins
# are out of scope. Module-level variables that aren't definitions
# (SessionLocal, settings, pipeline, _client) are not nodes, so calls *on*
# them aren't listed either.
#
# kind:
#   call             a direct call of a function, method or class (instantiation)
#   reference        a function/class passed as a value (callback, background
#                    task, db.query(Model), keyword arg) -- not called at that line
#   param_reference  a reference inside a parameter default, e.g. Depends(get_db)
#   inherits         class A(B)
# hard: true marks connections no static rule can be expected to find
# (the target depends on runtime values).
#
# src/dst are `file:qualname`; `file:<module>` is top-level code of that file.
# lines are every call site of that pair (each line = one site).
#
# Amendment log (each change re-verified by reading the cited line):
#   2026-11-10, after the step 1 "after-v1" run: added 9 real references the
#   first labelling pass missed -- 8 `response_model=X` decorator arguments
#   (attributed to the decorated route) and `StateGraph(PipelineState)`.
#   Reported as ground-truth omissions in eval/reports/step1-engine.md.

