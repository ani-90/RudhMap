# Step B tool evaluation data, written by hand 2026-11-12 BEFORE running
# eval/tools_eval.py. Tuning repos only (no held-out question or rich).
#
# find: a query a model would plausibly type, and the symbol ids (repo-relative)
#   any of which counts as correct. Scored as top-3 accuracy.
# coverage: for each tuning question in eval/bench/questions.yaml, the 1-2
#   RudhMap calls a model would naturally make first, and strings that must
#   appear in their combined output for the answer key's facts to be visible
#   (symbol names and decisive code fragments). A question is "covered" when
#   every required string appears.

find:
  # Knowledge-News-App
  - {repo: knowledge-news-app, query: "refresh feed", expect: ["app/api/feed.py:refresh_feed"]}
  - {repo: knowledge-news-app, query: "quiz submit score", expect: ["app/db/crud.py:submit_quiz_session", "app/api/quiz.py:submit_quiz"]}
  - {repo: knowledge-news-app, query: "similarity search", expect: ["app/db/qdrant.py:search_similar"]}
  - {repo: knowledge-news-app, query: "groq rate limit retry", expect: ["app/services/groq_client.py:_call_messages"]}
  - {repo: knowledge-news-app, query: "daily scheduler", expect: ["app/scheduler.py:start_scheduler", "app/scheduler.py:_daily_refresh"]}
  - {repo: knowledge-news-app, query: "debate", expect: ["app/api/debate.py:debate_message", "app/services/groq_client.py:debate_reply"]}
  - {repo: knowledge-news-app, query: "bulk insert articles", expect: ["app/db/crud.py:bulk_insert_articles"]}
  - {repo: knowledge-news-app, query: "normalize url", expect: ["app/pipeline/agents/base_agent.py:_normalise_url"]}
  - {repo: knowledge-news-app, query: "fetch articles tavily", expect: ["app/pipeline/agents/base_agent.py:BaseAgent._fetch_all", "app/services/tavily_client.py:search"]}
  - {repo: knowledge-news-app, query: "run pipeline", expect: ["app/pipeline/graph.py:run_pipeline"]}
  # fastapi-template
  - {repo: fastapi-template, query: "login access token", expect: ["backend/app/api/routes/login.py:login_access_token"]}
  - {repo: fastapi-template, query: "authenticate user password", expect: ["backend/app/crud.py:authenticate"]}
  - {repo: fastapi-template, query: "current user", expect: ["backend/app/api/deps.py:get_current_user"]}
  - {repo: fastapi-template, query: "create access token", expect: ["backend/app/core/security.py:create_access_token"]}
  - {repo: fastapi-template, query: "password reset email", expect: ["backend/app/utils.py:generate_reset_password_email", "backend/app/api/routes/login.py:recover_password"]}
  - {repo: fastapi-template, query: "delete item", expect: ["frontend/src/components/Items/DeleteItem.tsx:DeleteItem", "backend/app/api/routes/items.py:delete_item"]}
  - {repo: fastapi-template, query: "is logged in", expect: ["frontend/src/hooks/useAuth.ts:isLoggedIn"]}
  - {repo: fastapi-template, query: "useAuth", expect: ["frontend/src/hooks/useAuth.ts:useAuth"]}
  - {repo: fastapi-template, query: "api error handler", expect: ["frontend/src/main.tsx:handleApiError"]}
  - {repo: fastapi-template, query: "superuser", expect: ["backend/app/api/deps.py:get_current_active_superuser"]}
  - {repo: fastapi-template, query: "default secret check", expect: ["backend/app/core/config.py:Settings._check_default_secret"]}
  # httpx
  - {repo: httpx, query: "redirects", expect: ["httpx/_client.py:Client._send_handling_redirects", "httpx/_client.py:BaseClient._build_redirect_request"]}
  - {repo: httpx, query: "redirect method", expect: ["httpx/_client.py:BaseClient._redirect_method"]}
  - {repo: httpx, query: "digest auth", expect: ["httpx/_auth.py:DigestAuth"]}
  - {repo: httpx, query: "Timeout", expect: ["httpx/_config.py:Timeout"]}
  - {repo: httpx, query: "transport handle request", expect: ["httpx/_transports/base.py:BaseTransport.handle_request", "httpx/_transports/default.py:HTTPTransport.handle_request"]}
  - {repo: httpx, query: "httpcore exceptions", expect: ["httpx/_transports/default.py:map_httpcore_exceptions"]}
  - {repo: httpx, query: "response encoding", expect: ["httpx/_models.py:Response.encoding", "httpx/_models.py:Response.charset_encoding"]}
  - {repo: httpx, query: "content decoder", expect: ["httpx/_models.py:Response._get_content_decoder"]}
  - {repo: httpx, query: "send single request", expect: ["httpx/_client.py:Client._send_single_request"]}

coverage:
  kna-1:
    calls: [[show, refresh_feed], [trace, refresh_feed]]
    require: [get_last_successful_run, create_pipeline_run, _run_pipeline_bg, run_pipeline, run_all_agents_node, aggregator_node]
  kna-2:
    calls: [[show, BaseAgent.run], [show, aggregator_node]]
    require: [_fetch_all, generate_queries, enrich_content, _is_quality, "return []", search_similar, bulk_insert_articles]
  kna-3:
    calls: [[find_symbol, scheduler], [show, start_scheduler]]
    require: [start_scheduler, "nothing in this repo"]
  kna-4:
    calls: [[show, search_similar], [show, aggregator_node]]
    require: [aggregator_node, "threshold=0.85", "settings.similarity_threshold"]
  kna-5:
    calls: [[show, "app/api/quiz.py:generate_quiz"], [show, "app/api/quiz.py:submit_quiz"]]
    require: [summarize, create_quiz_session, submit_quiz_session, "409"]
  tpl-1:
    calls: [[show, login_access_token], [show, authenticate]]
    require: [authenticate, create_access_token, DUMMY_HASH, verify_password, "Incorrect email or password"]
  tpl-2:
    calls: [[show, get_user_by_email]]
    require: [authenticate, create_user, register_user, update_user_me, update_user, recover_password, reset_password, recover_password_html_content]
  tpl-3:
    calls: [[show, DeleteItem], [show, delete_item]]
    require: [ItemsService.deleteItem, ItemActionsMenu, invalidateQueries, "Not enough permissions", session.delete]
  tpl-4:
    calls: [[show, isLoggedIn], [show, handleApiError]]
    require: ["_layout.tsx", "login.tsx", localStorage, "401", get_current_user]
  tpl-5:
    calls: [[show, Settings], [show, Settings._enforce_non_default_secrets]]
    require: [create_access_token, get_current_user, generate_password_reset_token, verify_password_reset_token, changethis]
  httpx-1:
    calls: [[show, Client._send_handling_redirects], [show, BaseClient._build_redirect_request]]
    require: [_send_single_request, _redirect_method, _redirect_headers, _redirect_stream, next_request, follow_redirects]
  httpx-2:
    calls: [[show, BaseTransport.handle_request]]
    require: [HTTPTransport.handle_request, WSGITransport.handle_request, MockTransport.handle_request, _send_single_request]
  httpx-3:
    calls: [[show, BaseClient.build_request], [show, HTTPTransport.handle_request]]
    require: ["timeout.as_dict()", "extensions", "httpcore.Request", map_httpcore_exceptions]
  httpx-4:
    calls: [[show, DigestAuth.auth_flow], [show, Client._send_handling_auth]]
    require: [_parse_challenge, _build_auth_header, "401", sync_auth_flow, "auth_flow.send"]
  httpx-5:
    calls: [[show, Response.text], [show, Response.encoding]]
    require: [TextDecoder, charset_encoding, default_encoding, _get_content_decoder]
