questions:

  # ---------------------------------------------------------------- Knowledge-News-App
  - id: kna-1
    repo: knowledge-news-app
    type: explain
    question: >-
      Explain refresh_feed() in app/api/feed.py: what it does, what it calls, and
      what happens after it returns.
    facts:
      - id: cooldown
        must: There is a 2-hour cooldown based on the last successful run; inside it the call returns 'skipped' without starting a run.
        critical: true
        text: >-
          It first checks for a cooldown: it gets the last successful run
          (status success or partial, latest finished_at) and, if that finished less
          than 2 hours ago, returns status "skipped" with the remaining cooldown
          seconds and does not start a run.
        where: app/api/feed.py:17,27-42; app/db/crud.py:130-136
      - id: creates-run
        must: Otherwise it creates a pipeline-run record (new run_id) and marks it running.
        critical: true
        text: >-
          Otherwise it resolves the domains (request.resolved_domains(): all 7 when
          none given, else the valid ones), creates a pipeline-run record with a new
          uuid run_id and sets it to "running".
        where: app/api/feed.py:44-48; app/schemas/feed.py:11-14
      - id: background
        must: The pipeline is started as a background task and the endpoint returns immediately with status 'running'.
        critical: true
        text: >-
          It schedules _run_pipeline_bg as a FastAPI background task and returns
          immediately with run_id and status "running"; the pipeline runs after the
          response is sent.
        where: app/api/feed.py:50-52
      - id: pipeline
        must: The background pipeline runs the domain agents and then the aggregator (a LangGraph graph in app/pipeline/graph.py); a failure marks the run 'failed'.
        critical: true
        text: >-
          _run_pipeline_bg calls run_pipeline (app/pipeline/graph.py), a LangGraph
          graph that runs all domain agents (run_all_agents node) and then the
          aggregator node; if it raises, the run is marked "failed" with the error.
        where: app/api/feed.py:55-72; app/pipeline/graph.py:56-83
      - id: status
        critical: false
        text: >-
          The aggregator writes the final status and persisted/duplicate counts to
          the run record, and the client can poll GET /api/feed/status/{run_id}.
        where: app/pipeline/aggregator.py:97-106; app/api/feed.py:75-88

  - id: kna-2
    repo: knowledge-news-app
    type: trace
    question: >-
      Walk through what happens to a single news article from being fetched to
      being stored, including every deduplication step.
    facts:
      - id: fetch
        must: Agents fetch from Tavily (using queries generated by Groq, or hardcoded fallback queries) and from NewsAPI.
        critical: true
        text: >-
          Each domain agent (BaseAgent._fetch_all) gets search queries from Groq
          (groq_client.generate_queries, falling back to the agent's hardcoded
          queries), searches Tavily, and also pulls NewsAPI headlines for its keywords.
        where: app/pipeline/agents/base_agent.py:84-119
      - id: url-norm
        must: URLs are normalised (tracking params stripped) and deduplicated within an agent.
        critical: true
        text: >-
          URLs are normalised (tracking params like utm_* / fbclid stripped) and
          deduplicated by normalised URL within the agent.
        where: app/pipeline/agents/base_agent.py:13-25,100-104
      - id: enrich
        must: Each item's content is scraped/enriched and low-quality content is dropped before an ArticleData is built.
        critical: true
        text: >-
          BaseAgent.run scrapes/enriches content (scraper.enrich_content), drops
          low-quality content (_is_quality: >= 40 words, >= 5 words per line on
          average), calls embedder.embed(title + first 500 chars), and builds an
          ArticleData with an empty summary.
        where: app/pipeline/agents/base_agent.py:28-36,44-82
      - id: semantic
        must: Semantic (Qdrant) dedup exists in the aggregator but does not actually run, because embedder.embed() returns [] so articles have no embedding.
        critical: true
        text: >-
          The aggregator has a semantic-dedup pass (Qdrant search_similar, threshold
          0.85, skip on a match), but it only runs when article.embedding is
          non-empty, and embedder.embed() is a stub that returns [], so in this code
          semantic dedup (and the later Qdrant upsert) never actually happens.
          (An answer that describes the semantic pass as active is wrong on this fact.)
        where: app/pipeline/aggregator.py:26-38,64-79; app/services/embedder.py:4-5
      - id: url-exact
        must: Articles whose URL already exists in the database are skipped at insert (bulk_insert_articles).
        critical: true
        text: >-
          crud.bulk_insert_articles skips any article whose URL already exists in
          SQLite (and rolls back if a parallel insert hit the same URL). This is the
          dedup that actually takes effect.
        where: app/db/crud.py:40-64; app/pipeline/aggregator.py:59-82
      - id: parallel
        critical: false
        text: >-
          Agents for all requested domains run in parallel in a thread pool
          (run_all_agents_node) and their articles are merged before the aggregator.
        where: app/pipeline/graph.py:28-53

  - id: kna-3
    repo: knowledge-news-app
    type: behavior
    question: >-
      Is the daily scheduled news refresh actually running when the API server
      starts? Explain how it is (or isn't) wired up.
    facts:
      - id: not-started
        must: 'No: start_scheduler() is never called (the startup lifespan only calls init_db).'
        critical: true
        text: >-
          No. start_scheduler() in app/scheduler.py is never called anywhere in the
          code; the app's lifespan only calls init_db(), and run.py only starts
          uvicorn.
        where: app/scheduler.py:43-53; app/main.py:17-20; run.py:4-6
      - id: would-do
        critical: false
        text: >-
          If it were started, an APScheduler cron job would run _daily_refresh at
          07:00 by default, which creates a run and runs the pipeline for all domains
          with user_id=1 via asyncio.run(run_pipeline(...)).
        where: app/scheduler.py:15-40,43-50
      - id: settings-unused
        critical: false
        text: >-
          settings.schedule_hour / schedule_minute exist in config but are not used
          by any code (start_scheduler has its own defaults).
        where: app/config.py:31-32

  - id: kna-4
    repo: knowledge-news-app
    type: impact
    question: >-
      If I change similarity_threshold in app/config.py, what changes in article
      deduplication?
    facts:
      - id: no-effect
        must: Changing it has no effect on dedup, because the aggregator passes threshold=0.85 explicitly.
        critical: true
        text: >-
          Nothing changes in the pipeline: the aggregator calls
          search_similar(article.embedding, threshold=0.85) with a hardcoded 0.85.
        where: app/pipeline/aggregator.py:31
      - id: default-only
        must: The setting is only a fallback default inside search_similar, used when no threshold is passed.
        critical: true
        text: >-
          settings.similarity_threshold is only used as the default inside
          search_similar when threshold is None, and no caller relies on that default.
        where: app/db/qdrant.py:39-41
      - id: mechanics
        critical: false
        text: >-
          search_similar is a Qdrant search with score_threshold and limit=1 on a
          cosine-distance collection; any hit means duplicate. And semantic dedup
          doesn't run at all today, because embedder.embed() returns [].
        where: app/db/qdrant.py:35,39-48; app/pipeline/aggregator.py:29-35; app/services/embedder.py:4-5

  - id: kna-5
    repo: knowledge-news-app
    type: trace
    question: How is a quiz generated for an article, and how is a submitted quiz scored?
    facts:
      - id: summary-first
        must: Generation first creates and stores a summary if the article has none.
        critical: true
        text: >-
          POST /api/quiz/generate loads the article (404 if missing); if it has no
          summary it first summarizes it with Groq and stores the summary.
        where: app/api/quiz.py:22-31
      - id: generate
        must: The LLM (Groq) generates 3 multiple-choice questions from the summary, and they are stored with their answers in a quiz session.
        critical: true
        text: >-
          groq_client.generate_quiz(summary) asks the LLM for exactly 3
          multiple-choice questions as JSON (empty list on bad JSON -> HTTP 422); the
          questions including answers are stored in a quiz session.
        where: app/services/groq_client.py:88-97; app/api/quiz.py:33-43; app/db/crud.py:141-152
      - id: answers-hidden
        must: The correct answers are not sent to the client.
        critical: true
        text: The response to the client leaves out the correct answers.
        where: app/api/quiz.py:45-57; app/schemas/quiz.py:18-22
      - id: scoring
        must: Submission compares the user's answers to the stored answers (case-insensitive) and score = correct / total; resubmitting is rejected.
        critical: true
        text: >-
          POST /api/quiz/submit: 404 if the session is missing, 409 if already
          submitted; submit_quiz_session compares answers keyed by question index
          ("0","1",...) case-insensitively, score = correct / total, and the response
          includes a per-question breakdown.
        where: app/api/quiz.py:67-96; app/db/crud.py:155-171
      - id: groq-retry
        critical: false
        text: >-
          Groq calls go through _call_messages: at most 2 concurrent calls
          (semaphore) and retries on 429 with 8/16/32/64 s backoff.
        where: app/services/groq_client.py:15-19,38-54

  # ---------------------------------------------------------------- fastapi-template
  - id: tpl-1
    repo: fastapi-template
    type: trace
    question: >-
      How does password login work in the backend, from the /login/access-token
      request to the token returned? Include what happens when the email doesn't
      exist.
    facts:
      - id: route
        must: The login route calls crud.authenticate with the form's username (email) and password.
        critical: true
        text: >-
          login_access_token (backend/app/api/routes/login.py) takes an OAuth2
          password form and calls crud.authenticate(email=username, password).
        where: backend/app/api/routes/login.py:23-30
      - id: unknown-email
        must: For an unknown email, authenticate still verifies against a dummy hash (timing-attack protection) and returns None, giving a 400 'Incorrect email or password'.
        critical: true
        text: >-
          crud.authenticate looks the user up by email; if not found it still runs
          verify_password against a dummy hash (to keep timing the same and prevent
          user enumeration) and returns None; the route then returns 400 "Incorrect
          email or password".
        where: backend/app/crud.py:42-51; backend/app/api/routes/login.py:33-34
      - id: verify
        must: Passwords are verified with pwdlib (Argon2/bcrypt), and an outdated hash is upgraded and saved.
        critical: true
        text: >-
          Passwords are checked with pwdlib (Argon2, with bcrypt also accepted) via
          verify_and_update; if the hash needs upgrading the new hash is saved to the
          user.
        where: backend/app/core/security.py:11-16,29-32; backend/app/crud.py:52-60
      - id: inactive
        critical: false
        text: An inactive user gets 400 "Inactive user".
        where: backend/app/api/routes/login.py:35-36
      - id: token
        must: The returned token is a JWT (sub = user id, exp) signed with SECRET_KEY using HS256, created by create_access_token.
        critical: true
        text: >-
          The token is a JWT from security.create_access_token: payload exp + sub
          (user id), HS256, signed with settings.SECRET_KEY, expiring after
          ACCESS_TOKEN_EXPIRE_MINUTES (default 8 days).
        where: backend/app/core/security.py:19-26; backend/app/api/routes/login.py:37-42; backend/app/core/config.py:25

  - id: tpl-2
    repo: fastapi-template
    type: impact
    question: >-
      Which application code (not tests) calls crud.get_user_by_email, and what does
      each caller use the result for? I'm considering changing its signature.
    facts:
      - id: crud
        must: crud.authenticate calls it.
        critical: true
        text: crud.authenticate uses it to find the user before checking the password.
        where: backend/app/crud.py:46
      - id: users-routes
        must: 'Four users.py routes call it: create_user, register_user, update_user_me and update_user.'
        critical: true
        text: >-
          Four routes in users.py: create_user and register_user (reject with 400 if
          the email already exists), update_user_me and update_user (reject with 409
          if the new email belongs to a different user).
        where: backend/app/api/routes/users.py:61,90,151,204
      - id: login-routes
        must: 'Three login.py routes call it: recover_password, reset_password and recover_password_html_content.'
        critical: true
        text: >-
          Three routes in login.py: recover_password (send a reset email only if the
          user exists, same response either way), reset_password (400 "Invalid token"
          if missing), recover_password_html_content (404 if missing).
        where: backend/app/api/routes/login.py:58,85,109
      - id: not-init-db
        critical: false
        text: >-
          init_db in core/db.py does not use it; it queries User by email with its
