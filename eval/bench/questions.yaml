        where: backend/app/core/db.py:24-26

  - id: tpl-3
    repo: fastapi-template
    type: trace
    question: >-
      In the frontend, when a user deletes an item, trace what happens end to end
      until the row is removed from the database, including how the request is
      authenticated and how the list updates.
    facts:
      - id: component
        must: The DeleteItem component's mutation calls ItemsService.deleteItem with the item id.
        critical: true
        text: >-
          DeleteItem (frontend/src/components/Items/DeleteItem.tsx), opened from the
          item's actions menu (ItemActionsMenu, rendered in the items table columns),
          runs a react-query mutation that calls ItemsService.deleteItem({ path: { id } }).
        where: frontend/src/components/Items/DeleteItem.tsx:33-38,50-52; frontend/src/components/Items/ItemActionsMenu.tsx:30; frontend/src/components/Items/columns.tsx:70
      - id: http
        must: The generated client sends a DELETE request carrying the token from localStorage (via the auth callback configured in main.tsx) as the Authorization header.
        critical: true
        text: >-
          The generated client sends DELETE /api/v1/items/{id} with bearer auth; the
          token is read from localStorage "access_token" by the auth callback set in
          main.tsx and sent as "Authorization: Bearer <token>".
        where: frontend/src/client/sdk.gen.ts:325-331; frontend/src/main.tsx:17-20; frontend/src/client/core/auth.gen.ts:22-34
      - id: backend
        must: The backend delete_item route authenticates the user from the JWT, returns 404/403 for a missing item or a non-owner non-superuser, then deletes and commits.
        critical: true
        text: >-
          Backend delete_item (backend/app/api/routes/items.py) gets the current user
          from the JWT (CurrentUser -> get_current_user), returns 404 if the item
          doesn't exist, 403 if the user is neither superuser nor owner, otherwise
          deletes and commits.
        where: backend/app/api/routes/items.py:99-113; backend/app/api/deps.py:30-49
      - id: refresh
        must: After the mutation, queries are invalidated so the items list refetches.
        critical: true
        text: >-
          On success it shows a toast and closes the dialog; onSettled invalidates
          all react-query queries, so the items list refetches.
        where: frontend/src/components/Items/DeleteItem.tsx:39-47
      - id: auth-error
        critical: false
        text: >-
          A 401/403 from any query or mutation is handled globally in main.tsx:
          the token is removed and the browser goes to /login.
        where: frontend/src/main.tsx:22-38

  - id: tpl-4
    repo: fastapi-template
    type: behavior
    question: >-
      How does the frontend decide whether the user is logged in, and what happens
      when their token has expired or is invalid?
    facts:
      - id: presence-only
        must: isLoggedIn() only checks that an access_token exists in localStorage, without checking expiry or validity.
        critical: true
        text: >-
          isLoggedIn() only checks that localStorage has an "access_token"; it never
          checks expiry or validity.
        where: frontend/src/hooks/useAuth.ts:14-16
      - id: route-guards
        must: Route beforeLoad guards use isLoggedIn() to redirect to /login (and away from /login when logged in).
        critical: true
        text: >-
          The /_layout route's beforeLoad redirects to /login when not logged in, and
          the /login route redirects to / when already logged in.
        where: frontend/src/routes/_layout.tsx:12-21; frontend/src/routes/login.tsx:35-43
      - id: backend-rejects
        must: The backend rejects an expired/invalid token in get_current_user (JWT decode fails, 403).
        critical: true
        text: >-
          An expired/invalid token is rejected by the backend's get_current_user
          (JWT decode fails -> 403 "Could not validate credentials").
        where: backend/app/api/deps.py:30-40
      - id: global-handler
        must: A global error handler in main.tsx catches 401/403, removes the token and redirects to /login.
        critical: true
        text: >-
          The frontend's global react-query error handler (handleApiError in
          main.tsx) catches 401/403, removes the token and redirects to /login.
        where: frontend/src/main.tsx:22-38
      - id: login-stores
        critical: false
        text: >-
          Login stores the token from LoginService.loginAccessToken in localStorage;
          logout removes it and navigates to /login.
        where: frontend/src/hooks/useAuth.ts:41-59

  - id: tpl-5
    repo: fastapi-template
    type: usage
    question: >-
      Where is SECRET_KEY used in the backend, and what happens at startup if it is
      left as "changethis"?
    facts:
      - id: access-tokens
        must: SECRET_KEY signs access tokens and verifies them in get_current_user.
        critical: true
        text: >-
          It signs access tokens (security.create_access_token) and verifies them in
          get_current_user (jwt.decode).
        where: backend/app/core/security.py:25; backend/app/api/deps.py:32-34
      - id: reset-tokens
        must: SECRET_KEY also signs and verifies password-reset tokens.
        critical: true
        text: >-
          It also signs and verifies password-reset tokens
          (generate_password_reset_token / verify_password_reset_token in
          backend/app/utils.py).
        where: backend/app/utils.py:105-125
      - id: changethis
        must: A 'changethis' value raises an error at settings load, except when FASTAPI_ENV is 'development', where it only warns.
        critical: true
        text: >-
          Settings validation (_enforce_non_default_secrets -> _check_default_secret)
          raises ValueError for "changethis" unless FASTAPI_ENV is "development", in
          which case it only warns.
        where: backend/app/core/config.py:68-88
      - id: other-secrets
        critical: false
        text: >-
          The same check applies to the database password and
          FIRST_SUPERUSER_PASSWORD.
        where: backend/app/core/config.py:82-86

  # ---------------------------------------------------------------- httpx
  - id: httpx-1
    repo: httpx
    type: trace
    question: >-
      How does httpx's Client follow redirects? Trace the code path from
      Client.send() and explain how the redirected request's method, headers and
      body are decided.
    facts:
      - id: default-off
        must: Redirects are not followed by default (follow_redirects defaults to False).
        critical: true
        text: >-
          Redirects are not followed by default (follow_redirects=False); then the
          redirect response is returned with response.next_request set.
        where: httpx/_client.py:197,654,991-995
      - id: path
        must: send() -> _send_handling_auth() -> _send_handling_redirects(), which loops sending requests and builds the next one with _build_redirect_request().
        critical: true
        text: >-
          send() -> _send_handling_auth() -> _send_handling_redirects(), which loops:
          _send_single_request() (transport.handle_request), and if the response has
          a redirect location builds the next request with _build_redirect_request().
        where: httpx/_client.py:879-928,930-962,964-999,1001-1034,475-492
      - id: method
        must: 303 and 302 become GET (except HEAD), and a POST answered with 301 becomes GET.
        critical: true
        text: >-
          _redirect_method: 303 -> GET (unless HEAD), 302 -> GET (unless HEAD), and a
          POST answered with 301 -> GET; otherwise the method is kept.
        where: httpx/_client.py:494-515
      - id: headers-body
        must: Authorization is dropped on cross-origin redirects, and when switching to GET the body and body headers are dropped.
        critical: true
        text: >-
          _redirect_headers drops Authorization when redirecting to a different
          origin (except a same-host http->https upgrade) and updates Host; when the
          method changes to GET it drops Content-Length/Transfer-Encoding and the body
          (_redirect_stream); the Cookie header is always dropped and rebuilt from the
          client cookie store.
        where: httpx/_client.py:546-582,484
      - id: max
        critical: false
        text: >-
          More than max_redirects (default 20) raises TooManyRedirects; relative
          Location headers are joined onto the request URL.
        where: httpx/_client.py:971-974,537-538; httpx/_config.py:248

  - id: httpx-2
    repo: httpx
    type: impact
    question: >-
      If I change the signature of BaseTransport.handle_request, which classes and
      call sites in httpx (not tests) are affected?
    facts:
      - id: implementers
        must: HTTPTransport, WSGITransport and MockTransport implement handle_request.
        critical: true
        text: >-
          Implementations: HTTPTransport (_transports/default.py), WSGITransport
          (_transports/wsgi.py) and MockTransport (_transports/mock.py, which
          implements both the sync and async interfaces).
        where: httpx/_transports/default.py:135,230; httpx/_transports/wsgi.py:44,91; httpx/_transports/mock.py:15,19
      - id: call-site
        must: Client._send_single_request calls transport.handle_request (transport from _transport_for_url).
        critical: true
        text: >-
          The call site is Client._send_single_request, which calls
          transport.handle_request(request) on the transport chosen by
          _transport_for_url (mounts/proxy transports or the default _transport).
        where: httpx/_client.py:1001-1014,760-769
      - id: async-separate
        critical: false
        text: >-
          The async side (AsyncBaseTransport.handle_async_request, AsyncHTTPTransport,
          ASGITransport, AsyncClient) is a separate interface and not directly
          affected.
        where: httpx/_transports/base.py:65-86; httpx/_transports/asgi.py:63,99; httpx/_transports/default.py:279,374
      - id: user-transports
        critical: false
        text: >-
          Custom transports users pass via Client(transport=...) or mounts= would
          also have to change.
        where: httpx/_client.py:711-714,728-729
      - id: httpcore
        critical: false
        text: >-
          HTTPTransport.handle_request itself calls httpcore's pool.handle_request,
          which is httpcore's own API and unaffected.
        where: httpx/_transports/default.py:249-250

  - id: httpx-3
    repo: httpx
    type: trace
    question: >-
      Where is the request timeout configured in httpx, and how does it get from
      the Client down to the network layer? What exceptions come out when it fires?
    facts:
      - id: config
        must: Timeouts are a Timeout object (connect/read/write/pool), default 5 seconds, stored on the Client.
        critical: true
        text: >-
          Timeout (httpx/_config.py) holds connect/read/write/pool values; the client
          default is Timeout(5.0) for all four, and Client(timeout=...) stores
          Timeout(timeout).
        where: httpx/_config.py:72-138,246; httpx/_client.py:196,212
      - id: extensions
        must: The timeout is put into request.extensions['timeout'] when the request is built (per-request value overrides the client's).
        critical: true
        text: >-
          build_request() puts timeout.as_dict() into request.extensions["timeout"]
          (a per-request timeout overrides the client's); send() fills it in via
          _set_timeout() if missing.
        where: httpx/_client.py:370-377,584-591,910
      - id: transport
        must: HTTPTransport passes request.extensions, including the timeout, to httpcore, which enforces it.
        critical: true
        text: >-
          HTTPTransport.handle_request passes request.extensions (including the
          timeout) into the httpcore.Request, and httpcore enforces it.
        where: httpx/_transports/default.py:237-250
      - id: exceptions
        must: httpcore timeout errors are mapped to httpx ConnectTimeout/ReadTimeout/WriteTimeout/PoolTimeout.
        critical: true
        text: >-
          map_httpcore_exceptions converts httpcore timeouts to httpx
          ConnectTimeout / ReadTimeout / WriteTimeout / PoolTimeout (subclasses of
          TimeoutException), picking the most specific.
        where: httpx/_transports/default.py:74-118
      - id: forms
        critical: false
        text: >-
          Timeout accepts a single float, a tuple, another Timeout, or all four
          values; without a default and not all four set, it raises ValueError.
        where: httpx/_config.py:86-130

  - id: httpx-4
    repo: httpx
    type: explain
    question: How does DigestAuth work in httpx, and how does the client drive it?
    facts:
      - id: generator
        must: 'Auth is a generator flow: the client sends each yielded request and feeds the response back (_send_handling_auth / auth_flow.send).'
        critical: true
        text: >-
          Auth classes are generators (auth_flow). The client calls
          auth.sync_auth_flow(request) in _send_handling_auth, sends the first
          yielded request, and feeds each response back with .send(response) until
          the generator stops; intermediate responses go into history.
        where: httpx/_auth.py:38-85; httpx/_client.py:930-962
      - id: challenge
        must: On a 401 with a Digest WWW-Authenticate header, DigestAuth parses the challenge, builds an Authorization header and resends the request.
        critical: true
        text: >-
          DigestAuth.auth_flow sends the request; if the response is a 401 with a
          "WWW-Authenticate: Digest ..." header, it parses the challenge (realm,
          nonce, algorithm default MD5, opaque, qop; missing fields -> ProtocolError),
          builds an Authorization header and yields the request again.
        where: httpx/_auth.py:193-222,224-253
      - id: header
        must: The Authorization response hash is built from HA1 (username:realm:password) and HA2 (method:path) with the nonce (and nc/cnonce/qop when qop is used).
        critical: true
        text: >-
          The response hash: HA1 = H(username:realm:password) (re-hashed with nonce
          and cnonce for -sess algorithms), HA2 = H(method:path), response =
          H(HA1:nonce:nc:cnonce:qop:HA2), or H(HA1:nonce:HA2) with no qop. The hash
          function comes from the algorithm (MD5, SHA, SHA-256, SHA-512).
        where: httpx/_auth.py:176-185,255-301
      - id: qop
        critical: false
        text: Only qop "auth" is supported; "auth-int" raises NotImplementedError.
        where: httpx/_auth.py:329-340
      - id: reuse
        critical: false
        text: >-
          The last challenge is kept, so later requests send the Authorization
          header up front (nonce count incremented each time); response cookies are
          copied onto the retry.
        where: httpx/_auth.py:190-197,215,220-221,270-272

  - id: httpx-5
    repo: httpx
    type: explain
    question: >-
      How does Response.text turn the raw response body into a string? Cover both
      decompression and character-encoding selection.
    facts:
      - id: text
        must: .text decodes the already-read .content with a TextDecoder using response.encoding (fallback utf-8).
        critical: true
        text: >-
          .text requires the content to have been read (.content raises
          ResponseNotRead otherwise) and decodes it with TextDecoder using
          self.encoding (fallback utf-8), an incremental codec with errors="replace".
        where: httpx/_models.py:636-650; httpx/_decoders.py:306-318
      - id: encoding-order
        must: 'Encoding priority: explicitly set encoding, then the Content-Type charset, then default_encoding (a string or an autodetect callable).'
        critical: true
        text: >-
          Encoding priority: explicitly set .encoding; else the charset in the
          Content-Type header if it is a known encoding; else default_encoding,
          either a string or a callable run on the content (for autodetection);
          finally utf-8.
        where: httpx/_models.py:652-672,688-697
      - id: default-encoding
        critical: false
        text: >-
          default_encoding comes from the Client (default "utf-8"), set on each
          response in _send_single_request.
        where: httpx/_client.py:202,1023
      - id: decompress
        must: Decompression by Content-Encoding (gzip/deflate/br/zstd) happens earlier, in iter_bytes/read via _get_content_decoder.
        critical: true
        text: >-
          Decompression happens earlier, while reading bytes: iter_bytes uses
          _get_content_decoder, which picks decoders from Content-Encoding (gzip,
          deflate, br, zstd when installed; several -> MultiDecoder; none ->
          IdentityDecoder); read() joins iter_bytes into .content.
        where: httpx/_models.py:699-722,876-905; httpx/_decoders.py:381-393
      - id: setter
        critical: false
        text: Setting .encoding after .text has been accessed raises ValueError.
        where: httpx/_models.py:674-686

