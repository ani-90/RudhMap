# Step A benchmark questions and answer keys.
#
# Written 2026-11-11 by reading each repo's source at the pinned commit, before
# RudhMap was run on fastapi-template or httpx and before any step B tool existed.
# Not derived from RudhMap output.
#
# Grading: an answer is CORRECT when it states every critical fact's `must` line
# (in its own words; file:line citations are not required) and makes no major false claim
# about the code. Fact score = facts hit / facts total. "where" is for the grader
# and for RCA only.
#
# Changes after the first graded run go in the amendment log at the bottom.

