[project]
name = "rudhmap"
version = "0.1.0"
description = "Deterministic code graph for AI coding assistants: MCP server and CLI that return file:line-cited context for Python and TypeScript repos"
requires-python = ">=3.10"
dependencies = [
    "python-hcl2>=8.1.2",
    "pyyaml>=6.0",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-typescript>=0.23",
    "networkx>=3.0",
    "rank-bm25>=0.2.2",
    "mcp>=2.3,<3",
    "anyio>=4.9",
]

[project.scripts]
rudhmap = "rudhmap.cli:main"
rudhmap-mcp = "rudhmap.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
