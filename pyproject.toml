[project]
name = "rudhmap"
version = "0.1.0"
description = "MCP server that generates verified data flow diagrams from source code"
requires-python = ">=3.10"
dependencies = [
    "python-hcl2>=8.1.2",
    "pyyaml>=6.0",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-typescript>=0.23",
    "networkx>=3.0",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
